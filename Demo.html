/* ============================ random generator ============================ */

const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const round10 = (n) => Math.round(n / 10) * 10;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

const NAMES = [
  "Mokoena Electrical",
  "Sandton Spark Co.",
  "Nkosi Electrical Co",
  "Bright Wire Services",
  "Pretoria Power Works",
  "Fourways Electrical",
  "Midrand Sparks",
  "Van Wyk Electrical",
];

function makeSuppliers() {
  const names = [...NAMES].sort(() => Math.random() - 0.5).slice(0, 3);

  const a = (() => {
    const monthJobs = rnd(10, 18);
    const cap = Math.ceil(0.4 * monthJobs);
    const elecJobs = rnd(45, 180);
    const estimate = round10(rnd(2200, 4200));
    return {
      id: "a",
      name: names[0],
      trades: {
        Electrical: { jobs: elecJobs, onTime: rnd(90, 98), gap: rnd(2, 8) },
        Plumbing: { jobs: rnd(0, 2), onTime: null, gap: null },
      },
      lifetimeJobs: elecJobs,
      rolling12: rnd(24, 60),
      monthJobs,
      scopeChangesThisMonth: rnd(0, Math.max(0, cap - 2)),
      flaggedLastMonth: false,
      callout: round10(rnd(420, 600)),
      estimate,
      finalTotal: round10(estimate * (0.98 + Math.random() * 0.08)),
      eta: pick(SLOTS),
    };
  })();

  const b = (() => {
    const jobs = rnd(6, 25);
    const estimate = round10(rnd(1900, 3400));
    return {
      id: "b",
      name: names[1],
      trades: { Electrical: { jobs, onTime: rnd(72, 86), gap: rnd(16, 28) } },
      lifetimeJobs: jobs,
      rolling12: rnd(8, 19),
      monthJobs: rnd(4, 9),
      scopeChangesThisMonth: 4,
      flaggedLastMonth: true,
      callout: round10(rnd(320, 460)),
      estimate,
      finalTotal: round10(estimate * (1.15 + Math.random() * 0.25)),
      eta: pick(SLOTS),
    };
  })();

  const c = (() => {
    const callout = round10(rnd(380, 560));
    const ceiling = Math.floor((callout + 50) / 1.035) - 30;
    const jobs = rnd(0, 2);
    return {
      id: "c",
      name: names[2],
      trades: { Electrical: { jobs, onTime: null, gap: null } },
      lifetimeJobs: jobs,
      rolling12: jobs,
      monthJobs: rnd(1, 3),
      scopeChangesThisMonth: rnd(0, 1),
      flaggedLastMonth: false,
      callout,
      estimate: round10(rnd(900, 1800)),
      finalTotal: round10(rnd(220, Math.max(260, ceiling))),
      eta: pick(SLOTS),
    };
  })();

  return [a, b, c];
}

/* ================================ the rules =============================== */

function scopeCap(s) {
  if (s.lifetimeJobs < 3) return null;
  if (s.monthJobs < 10) return 4;
  return Math.ceil(0.4 * s.monthJobs);
}

const isHV = (s) => s.rolling12 >= 20;

function money({ supplier, job, hvCustomer, credit }) {
  if (!supplier) return null;

  const callout = job && job.callout != null ? job.callout : supplier.callout;
  const price = job && job.finalPrice != null ? job.finalPrice : supplier.finalTotal;

  const serviceRate = hvCustomer ? 0.02 : 0.025;
  const suppRate = isHV(supplier) ? 0.02 : 0.025;
  const shownRate = serviceRate + 0.01;

  const collected = callout + 50;

  const service = price * serviceRate;
  const cover = price * 0.01;
  const creditUsed = Math.min(credit, service);
  const spannaFeeShown = service + cover;
  const spannaFeeNet = spannaFeeShown - creditUsed;

  const totalOwed = price + spannaFeeNet;
  const diff = totalOwed - collected;
  const suppFee = price * suppRate;

  return {
    serviceRate,
    shownRate,
    suppRate,
    callout,
    collected,
    price,
    service,
    cover,
    creditUsed,
    spannaFeeShown,
    spannaFeeNet,
    totalOwed,
    extraCharge: diff > 0 ? diff : 0,
    refund: diff < 0 ? -diff : 0,
    suppFee,
    suppReceives: price - suppFee,
    spannaRevenue: service - creditUsed + suppFee,
    held: totalOwed,
  };
}

/* Splits the held money according to how a dispute was called. */
function settle(m, ruling) {
  if (!m) return null;
  if (ruling === "pro") {
    return { toPro: m.suppReceives, toCustomer: 0, spanna: m.spannaRevenue, fromCover: 0 };
  }
  if (ruling === "split") {
    const half = m.price / 2;
    return {
      toPro: half - half * m.suppRate,
      toCustomer: m.totalOwed - half,
      spanna: half * m.serviceRate + half * m.suppRate - m.creditUsed,
      fromCover: 0,
    };
  }
  // full refund to the customer, pro keeps the call-out only
  return { toPro: 0, toCustomer: m.totalOwed - m.callout, spanna: 0, fromCover: m.cover };
}

/* =============================== timeline ================================ */

function Timeline({ stage, disputed }) {
  const steps = [
    "Booking paid. We're holding it",
    "Your pro checks the job",
    "Final price locked in",
    "Rest of the money sits with us",
    "Job done",
    disputed ? "We're sorting the problem" : "7 days to flag anything",
    disputed ? "Money goes where it's due" : "Your pro gets paid",
  ];
  return (
    <div>
      {steps.map((s, i) => {
        const done = i < stage;
        const active = i === stage;
        const alert = disputed && i >= 5 && active;
        return (
          <div key={s} style={{ display: "flex", gap: 11 }}>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
              <div
                style={{
                  width: 21,
                  height: 21,
                  borderRadius: 99,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  background: done ? C.green : alert ? C.red : active ? C.blue : C.line,
                  color: done || active ? "#fff" : C.grey,
                  fontSize: 11,
                  fontWeight: 800,
                  flexShrink: 0,
                }}
              >
                {done ? "✓" : i + 1}
              </div>
              {i < steps.length - 1 && (
                <div style={{ width: 2, height: 20, background: done ? C.green : C.line }} />
              )}
            </div>
            <div
              style={{
                fontSize: 12.5,
                fontWeight: active ? 800 : 600,
                color: done || active ? C.ink : C.grey,
                paddingTop: 2,
              }}
            >
              {s}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ============================ dispute outcome ============================ */

function OutcomeCard({ m, ruling, who }) {
  const s = settle(m, ruling);
  const title =
    ruling === "pro"
      ? "We ruled in the pro's favour"
      : ruling === "split"
      ? "We split it down the middle"
      : "We refunded the customer";
  const tone = ruling === "pro" ? "green" : ruling === "split" ? "amber" : "red";
  return (
    <div>
      <Note tone={tone}>
        <b>{title}.</b>{" "}
        {who === "customer"
          ? ruling === "pro"
            ? "We went through both sides and the work checks out. Your pro gets paid in full."
            : ruling === "split"
            ? "Both sides had a point. Half the job cost comes back to you, your pro keeps the rest."
            : "The evidence backed you. Everything but the call-out comes back to your card in 3 working days."
          : ruling === "pro"
          ? "Your evidence held up. You're getting paid in full."
          : ruling === "split"
          ? "Both sides had a point, so we split it. You keep half the job cost plus your call-out."
          : "The customer's evidence was stronger this time. You keep the call-out fee only."}
      </Note>
      <Card style={{ marginTop: 10 }}>
        <Line k="Was being held" v={fmtR(m.held)} muted />
        <Rule />
        <Line k="Back to the customer" v={fmtR(s.toCustomer)} bold={s.toCustomer > 0} />
        <Line k="To the pro" v={fmtR(s.toPro)} bold={s.toPro > 0} />
        <Line k="Call-out fee (already theirs)" v={fmtR(m.callout)} muted />
        {s.fromCover > 0 && (
          <Line k="Covered by the cover fund" v={fmtR(s.fromCover)} sub="What the 1% is there for" />
        )}
      </Card>
    </div>
  );
}

/* =============================== CUSTOMER ================================ */

function CustomerView({ suppliers, job, setJob, hvCustomer, credit }) {

  const [urgency, setUrgency] = useState("This week");
  const [sort, setSort] = useState("callout");
  const [openBd, setOpenBd] = useState(false);
  const [complaint, setComplaint] = useState("");
  const [showComplaint, setShowComplaint] = useState(false);

  if (!job) {
    return (
      <div>

        <Card>

          />
          <div style={{ margin: "10px 0" }}>
            <Fake>Add a few photos</Fake>
          </div>
          <Label>When do you need someone?</Label>
          <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
            {["Right now", "This week", "No rush"].map((u) => (

                  color: urgency === u ? "#fff" : C.grey,

                {u}

            ))}

                  callout: null,

  if (!chosen) {
    const list = [...suppliers].sort((a, b) =>
      sort === "callout" ? a.callout - b.callout : a.estimate - b.estimate
    );

      <div>
        <Card style={{ background: C.blueDeep, border: "none", marginBottom: 12 }}>

            style={{
              color: "#8fb4ff",
              fontSize: 10.5,
              fontWeight: 800,

          return (
            <Card
              key={s.id}

                      <Pill bg={C.amberSoft} color={C.amber} bd={C.amberLine}>

                    )}
                    {isHV(s) && (
                      <Pill bg={C.greenSoft} color={C.green} bd="#c3e8d2">

                  </div>
                  <div style={{ fontSize: 11.5, color: C.green, fontWeight: 700, marginTop: 4 }}>

                  <div style={{ fontSize: 14, fontWeight: 800 }}>{fmtR0(s.estimate)}</div>
                </div>
                <div style={{ flex: 1, background: C.paper, borderRadius: 10, padding: "8px 10px" }}>
                  <div style={{ fontSize: 10.5, color: C.grey, fontWeight: 700 }}>CAN BE THERE</div>
                  <div style={{ fontSize: 12, fontWeight: 700 }}>{s.eta}</div>
                </div>
              </div>

              {isNew ? (
                <div style={{ fontSize: 11.5, color: C.grey, lineHeight: 1.5, marginBottom: 10 }}>

                  and timing.
                </div>
              ) : (
                <div style={{ fontSize: 11.5, color: C.grey, lineHeight: 1.6, marginBottom: 10 }}>
                  Shows up on time <b style={{ color: C.ink }}>{t.onTime}%</b> of the time ({t.jobs}{" "}
                  jobs)

              )}

              {drifts && (
                <div style={{ marginBottom: 10 }}>
                  <Note tone="amber">
                    <b>Worth knowing.</b> Their final price usually lands <b>{t.gap}% above</b> the

                    <b>{fmtR0(likely)}</b> once they've had a proper look.

                  <Note tone="green">
                    <b>Prices up front.</b> Their final price lands within {t.gap}% of the rough one,
                    across {t.jobs} jobs. What you see is roughly what you'll pay.
                  </Note>

            </Card>

  if (job.declined) {

      <div>
        <Label>All wrapped up</Label>
        <Card style={{ borderLeft: `4px solid ${C.grey}` }}>

          <div style={{ fontSize: 12, color: C.grey, lineHeight: 1.55, marginBottom: 10 }}>
            No hard feelings, and nothing more comes off your card. Here's exactly where your money
            went.
          </div>
          <Line k="Call-out fee, straight to your pro" v={fmtR(m.callout)} />
          <Line k="Our booking fee" v={fmtR(50)} />
          <Rule />
          <Line k="You paid" v={fmtR(m.collected)} bold />
        </Card>
        <div style={{ marginTop: 12 }}>
          <Btn full kind="ghost" onClick={() => setJob(null)}>
            Start a new job
          </Btn>
        </div>
      </div>
    );
  }

  /* ---- final price: no pricing history here, they've already committed ---- */
  if (job.stage === 2) {
    return (
      <div>
        <Label>The real price</Label>

          <Line k="All in" v={fmtR(m.totalOwed)} bold />

            <Line k="Left to pay" v={fmtR(m.extraCharge)} bold />

          <div style={{ marginTop: 10 }}>

              it happens.
            </Note>
          </div>
        )}

        {m.refund > 0 && (
          <div style={{ marginTop: 10 }}>
            <Note tone="green">
              <b>Good news.</b> Simpler job than expected, so it costs less than what you already
              paid. We're sending the difference back.
            </Note>
          </div>
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 12 }}>
          <Btn full onClick={() => setJob({ ...job, stage: 3 })}>
            Let's do it
          </Btn>
          <Btn full kind="danger" onClick={() => setJob({ ...job, declined: true })}>
            No thanks
          </Btn>
        </div>
      </div>

  const d = job.dispute;

  return (
    <div>
      <Card style={{ background: d && !d.ruling ? "#3a0d10" : C.blueDeep, border: "none", marginBottom: 12 }}>

            fontWeight: 800,

            textTransform: "uppercase",
          }}

          {d && !d.ruling ? "Frozen while we sort this" : job.stage >= 3 ? "Sitting safely with us" : "Paid so far"}
        </div>
        <div style={{ color: "#fff", fontFamily: font.display, fontSize: 29, margin: "4px 0 2px" }}>
          {job.stage >= 3 ? fmtR(m.held) : fmtR(m.collected)}
        </div>
        <div style={{ color: d && !d.ruling ? "#f3c7c7" : "#c3d6ff", fontSize: 12.5 }}>
          {chosen.name} · {job.eta}
        </div>
      </Card>

      {job.stage < 3 && (
        <div style={{ marginBottom: 12 }}>
          <button
            onClick={() => setOpenBd((v) => !v)}

              background: "none",
              border: "none",
              color: C.blue,
              fontWeight: 700,
              fontSize: 12,
              cursor: "pointer",
              padding: 0,
              fontFamily: font.body,

            {openBd ? "Hide" : "See"} exactly what you paid
          </button>
          {openBd && (
            <Card style={{ marginTop: 8 }}>
              <Line k="Call-out fee, straight to your pro" v={fmtR(m.callout)} />
              <Line k="Our booking fee" v={fmtR(50)} />
              <Rule />
              <Line k="Paid" v={fmtR(m.collected)} bold />
            </Card>
          )}
        </div>
      )}

      <Card style={{ marginBottom: 12 }}>
        <Label>Where things stand</Label>
        <Timeline stage={job.stage} disputed={!!d} />
      </Card>

      {job.stage === 0 && (
        <Note>
          Next up, hop over to the <b>Supplier</b> tab to check the job and set the real price.
        </Note>
      )}
      {job.stage === 1 && (
        <Note>
          Your pro is working out the real price. Jump to the <b>Supplier</b> tab to do it.
        </Note>
      )}
      {job.stage === 3 && (
        <Btn full onClick={() => setJob({ ...job, stage: 4 })}>
          Pretend: your pro finishes the job
        </Btn>
      )}

      {job.stage === 4 && !showComplaint && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <Note>
            Happy with the work? Say the word and your 7 days to flag anything starts. Do nothing and
            it kicks off on its own tomorrow.
          </Note>
          <Btn full onClick={() => setJob({ ...job, stage: 5 })}>
            All good, I'm happy
          </Btn>
          <Btn full kind="danger" onClick={() => setShowComplaint(true)}>
            Something's wrong
          </Btn>
        </div>
      )}

      {job.stage === 4 && showComplaint && (
        <Card style={{ borderLeft: `4px solid ${C.red}` }}>
          <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 4 }}>Tell us what happened</div>
          <div style={{ fontSize: 12, color: C.grey, lineHeight: 1.55, marginBottom: 10 }}>
            Your money stays with us from the second you send this. Nothing moves until it's sorted.
          </div>
          <TA
            tone="red"
            value={complaint}
            onChange={setComplaint}
            placeholder="What went wrong? The more detail, the faster we can call it."
          />
          <div style={{ margin: "10px 0" }}>
            <Fake>Attach photos or a video</Fake>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <Btn
              full
              kind="danger"
              disabled={complaint.trim().length < 5}
              onClick={() => {
                setJob({
                  ...job,
                  stage: 5,
                  dispute: {
                    reason: complaint.trim(),
                    evidence: null,
                    ruling: null,
                  },
                });
                setShowComplaint(false);
              }}
            >
              {complaint.trim().length < 5 ? "Add a bit more detail" : "Send it to us"}
            </Btn>
            <Btn full kind="quiet" onClick={() => setShowComplaint(false)}>
              Cancel
            </Btn>
          </div>
        </Card>
      )}

      {job.stage === 5 && !d && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <Note tone="green">
            <b>Sorted.</b> Your pro gets paid once the 7 days are up. If anything crops up before
            then, tell us and we'll hold the money.
          </Note>
          <Btn full onClick={() => setJob({ ...job, stage: 6 })}>
            Pretend: 7 days go by
          </Btn>
        </div>
      )}

      {job.stage === 5 && d && !d.ruling && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <Note tone="red">
            <b>We've got this.</b> Your money is frozen. Your pro has 2 days to send their side, then
            we make a call within 3 days and tell you exactly why.
          </Note>
          <Card>
            <Label>What you told us</Label>
            <div style={{ fontSize: 12.5, color: C.ink, lineHeight: 1.55 }}>"{d.reason}"</div>
            <Rule />
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 12, color: C.grey, fontWeight: 600 }}>Your pro's side</span>
              {d.evidence ? (
                <Pill bg={C.greenSoft} color={C.green} bd="#c3e8d2">
                  In
                </Pill>
              ) : (
                <Pill bg={C.amberSoft} color={C.amber} bd={C.amberLine}>
                  Waiting
                </Pill>
              )}
            </div>
            {d.evidence && (
              <div style={{ fontSize: 12.5, color: C.ink, lineHeight: 1.55, marginTop: 8 }}>
                "{d.evidence}"
              </div>
            )}
          </Card>
          <Note>
            {d.evidence ? (
              <>
                Both sides are in. Head to the <b>Spanna Admin</b> tab to make the call.
              </>
            ) : (
              <>
                Waiting on your pro. Switch to the <b>Supplier</b> tab to send their side.
              </>
            )}
          </Note>
        </div>
      )}

      {job.stage === 5 && d && d.ruling && (
        <div>
          <OutcomeCard m={m} ruling={d.ruling} who="customer" />
          <div style={{ marginTop: 12 }}>
            <Btn full kind="ghost" onClick={() => setJob(null)}>
              Start a new job
            </Btn>
          </div>
        </div>
      )}

      {job.stage === 6 && (
        <Card style={{ borderLeft: `4px solid ${C.green}` }}>
          <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 8 }}>
            {chosen.name} has been paid
          </div>
          <Line k="Job price" v={fmtR(m.price)} />
          <Line k={`Our fee (${(m.suppRate * 100).toFixed(1)}%)`} v={"-" + fmtR(m.suppFee)} />
          <Line k="They got" v={fmtR(m.suppReceives)} bold />
          <div style={{ marginTop: 12 }}>
            {job.rated ? (
              <Pill bg={C.blueSoft} color={C.blue} bd={C.blueLine}>
                Thanks, that helps the next person
              </Pill>
            ) : (
              <Btn small onClick={() => setJob({ ...job, rated: true })}>
                Rate {chosen.name}
              </Btn>
            )}
          </div>
          <div style={{ marginTop: 12 }}>
            <Btn small kind="ghost" onClick={() => setJob(null)}>
              Start a new job
            </Btn>
          </div>
        </Card>
      )}
    </div>
  );
}

                  width: 8,
                  height: 8,
                  borderRadius: 99,
                  background: C.red,
                }}
              />
            )}
          </button>
        ))}
      </div>

      <div
        style={{
          display: "flex",
          flexWrap: "wrap",
          gap: 8,
          justifyContent: "center",
          marginBottom: 16,
          maxWidth: 430,
        }}
      >
        <button onClick={() => setHvCustomer((v) => !v)} style={toggleStyle(hvCustomer)}>
          Regular customer · 2%
        </button>
        <button onClick={() => setCredit((v) => (v > 0 ? 0 : 50))} style={toggleStyle(credit > 0)}>
          R50 friend credit
        </button>
        <button onClick={shuffle} style={toggleStyle(false)}>
          Shuffle
        </button>
      </div>

      <div
        style={{
          width: "100%",
          maxWidth: 430,
          background: C.paper,
          borderRadius: 26,
          padding: "18px 15px 24px",
          boxShadow: "0 22px 55px rgba(6,20,63,0.16)",
          border: `1px solid ${C.line}`,
          minHeight: 560,
        }}
      >
        {role === "customer" && (
          <CustomerView
            suppliers={suppliers}
            job={job}
            setJob={setJob}
            hvCustomer={hvCustomer}
            credit={credit}
          />
        )}
        {role === "supplier" && (
          <SupplierView
            suppliers={suppliers}
            setSuppliers={setSuppliers}
            job={job}
            setJob={setJob}
            hvCustomer={hvCustomer}
            credit={credit}
          />
        )}
        {role === "admin" && (
          <AdminView
            suppliers={suppliers}
            job={job}
            setJob={setJob}
            hvCustomer={hvCustomer}
            credit={credit}
          />
        )}
      </div>

      <div
        style={{
          color: C.grey,
          fontSize: 11,
          marginTop: 16,
          textAlign: "center",
          lineHeight: 1.65,
          maxWidth: 430,
        }}
      >
        Demo only. Every name and number here is made up. Three tabs, one job: book it as the
        Customer, price it as the Supplier, follow the money as Admin. Red dot means someone's waiting
        on you.
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<SpannaDemo />);
  </script>
</body>
</html>
